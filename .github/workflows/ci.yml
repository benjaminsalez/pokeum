# Mirrors the local quality gate (pre-commit / the /verify skill): identical
# checks, identical pinned tool versions from requirements-dev.txt.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: mypy
        run: python -m mypy
      - name: compileall
        run: python -m compileall app main.py
      - name: Bandit
        run: python -m bandit -c pyproject.toml -r app main.py
      - name: detect-secrets
        run: git ls-files -z | grep -zvE '^(\.secrets\.baseline|openwiki/\.last-update\.json)$' | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: pytest
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
